services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osint_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osint_password}
      POSTGRES_DB: ${POSTGRES_DB:-osint_db}
    volumes:
      - nodex_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nodex]

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - nodex_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nodex]

  app:
    image: nodex/app:pilot
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-osint_user}:${POSTGRES_PASSWORD:-osint_password}@postgres:5432/${POSTGRES_DB:-osint_db}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_USER: ${POSTGRES_USER:-osint_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osint_password}
      POSTGRES_DB: ${POSTGRES_DB:-osint_db}
      SECRET_KEY: ${SECRET_KEY:-nodex-test-secret}
      ENVIRONMENT: closed-contour
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEOCODER_ENABLED: ${GEOCODER_ENABLED:-true}
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-Nodex/1.0}
      GEOCODER_TIMEOUT_SECONDS: ${GEOCODER_TIMEOUT_SECONDS:-10}
      GEOCODER_MIN_INTERVAL_SECONDS: ${GEOCODER_MIN_INTERVAL_SECONDS:-0}
      GEOCODER_MAX_CONCURRENCY: ${GEOCODER_MAX_CONCURRENCY:-4}
      IMPORT_STREAM_BATCH_SIZE: ${IMPORT_STREAM_BATCH_SIZE:-50000}
      DOMAIN_WRITE_BATCH_SIZE: ${DOMAIN_WRITE_BATCH_SIZE:-25000}
      MAP_PMTILES_URL: ${MAP_PMTILES_URL:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_MODEL_ANALYZE: ${LLM_MODEL_ANALYZE:-}
      LLM_MODEL_DRAFT: ${LLM_MODEL_DRAFT:-}
      LLM_MODEL_EDIT: ${LLM_MODEL_EDIT:-}
      LLM_RUNTIME_LABEL: ${LLM_RUNTIME_LABEL:-}
      CELL_TOWER_REFERENCE_DSN: ${CELL_TOWER_REFERENCE_DSN:-}
      CELL_TOWER_REFERENCE_TABLE: ${CELL_TOWER_REFERENCE_TABLE:-cell_tower_reference}
      CELL_TOWER_REFERENCE_TIMEOUT_SECONDS: ${CELL_TOWER_REFERENCE_TIMEOUT_SECONDS:-20}
    volumes:
      - ./plugins:/app/plugins
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [nodex]

  # Map requests must not wait behind imports, enrichment or database-heavy
  # API calls.  The service uses the same small application image but exposes
  # only the PMTiles reader and keeps its own HTTP connection/tile cache.
  map:
    image: nodex/app:pilot
    command: uvicorn app.map_service:app --host 0.0.0.0 --port 5001
    environment:
      MAP_PMTILES_URL: ${MAP_PMTILES_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [nodex]

  frontend:
    image: nodex/frontend:pilot
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      # A closed deployment must never select a saved online/terrain style.
      # This dedicated flag is consumed by the frontend entrypoint and cannot
      # be accidentally changed by a legacy MAP_MODE value in .env.closed.
      NODEX_FORCE_LOCAL_MAP: "1"
      MAP_MODE: local
      MAP_PMTILES_URL: ${MAP_PMTILES_URL:-}
      MAP_STYLE_URL: ${MAP_STYLE_URL:-}
      MAP_GLYPHS_URL: ${MAP_GLYPHS_URL:-}
    ports:
      - "${NODEX_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_started
      map:
        condition: service_started
    networks: [nodex]

networks:
  nodex:
    driver: bridge

volumes:
  nodex_postgres:
  nodex_redis:
