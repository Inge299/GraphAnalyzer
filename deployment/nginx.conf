server {
    listen 80;
    server_name _;
    client_max_body_size 10g;
    client_body_timeout 3600s;
    send_timeout 3600s;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    location /health {
        proxy_pass http://app:5000;
    }

    # The map archive may be hosted by a simple internal HTTP server that
    # allows Range requests but does not expose Content-Range through CORS.
    # PMTiles needs that header, so serve the configured archive same-origin.
    location = /_nodex/pmtiles {
        proxy_pass __NODEX_PMTILES_UPSTREAM__;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Expose-Headers "Accept-Ranges, Content-Length, Content-Range, ETag" always;
    }

    # MapLibre loads its worker as an ES module. Alpine nginx does not map
    # the .mjs extension by default, so explicitly serve it as JavaScript.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
