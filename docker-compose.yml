services:
  postgres:
    image: postgres:15-alpine
    container_name: osint-postgres
    environment:
      POSTGRES_USER: osint_user
      POSTGRES_PASSWORD: osint_password
      POSTGRES_DB: osint_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U osint_user -d osint_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osint-network

  redis:
    image: redis:7-alpine
    container_name: osint-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - osint-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: osint-app
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://osint_user:osint_password@postgres:5432/osint_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-for-development
      - ENVIRONMENT=development
      - POSTGRES_USER=osint_user
      - POSTGRES_PASSWORD=osint_password
      - POSTGRES_DB=osint_db
      - LLM_BASE_URL=http://host.docker.internal:1234/v1
      - LLM_API_KEY=lm-studio
      - LLM_TIMEOUT_SECONDS=120
      - LLM_MAX_CONTEXT_CHARS=24000
      - LLM_MODEL_ANALYZE=google/gemma-3-4b
      - LLM_MODEL_DRAFT=google/gemma-3-4b
      - LLM_MODEL_EDIT=google/gemma-3-4b
      - LLM_TEMPERATURE_ANALYZE=0.1
      - LLM_TEMPERATURE_DRAFT=0.3
      - LLM_TEMPERATURE_EDIT=0.2
      - LLM_RUNTIME_LABEL=GPU (RTX 4060 via LM Studio)
      - GEOCODER_ENABLED=${GEOCODER_ENABLED:-true}
      - GEOCODER_BASE_URL=${GEOCODER_BASE_URL:-https://nominatim.openstreetmap.org}
      - GEOCODER_USER_AGENT=${GEOCODER_USER_AGENT:-Nodex/1.0}
      - GEOCODER_TIMEOUT_SECONDS=${GEOCODER_TIMEOUT_SECONDS:-10}
      - GEOCODER_MIN_INTERVAL_SECONDS=${GEOCODER_MIN_INTERVAL_SECONDS:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osint-network
    volumes:
      - ./plugins:/app/plugins
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  pgadmin:
    image: dpage/pgadmin4
    container_name: osint-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - osint-network

networks:
  osint-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:






